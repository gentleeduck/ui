[build]
  command = "turbo run build --filter @gentleduck/ui-docs"
  publish = "apps/duck-ui-docs/.next"

[build.environment]
  # NEXT_PUBLIC_* vars are intentionally inlined by Next.js into client bundles.
  # NODE_ENV="production" appears everywhere in build output.
  # Skip these in secrets scanning to prevent false-positive build failures.
  SECRETS_SCAN_OMIT_KEYS = "NODE_ENV,NEXT_PUBLIC_APP_URL,NEXT_PUBLIC_DISCORD_URL,NEXT_PUBLIC_SPONSOR_URL"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
