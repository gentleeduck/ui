<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" font-family="'Inter', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="cardGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
  </defs>
  <rect width="680" height="300" fill="url(#cardGrad)" rx="12"/>
  <rect x="0.5" y="0.5" width="679" height="299" fill="none" stroke="#27272a" rx="12" stroke-width="1"/>
  <text x="340" y="36" text-anchor="middle" fill="#fafafa" font-size="15" font-weight="700" letter-spacing="0.02em">Supported Calendar Systems</text>
  <text x="340" y="54" text-anchor="middle" fill="#71717a" font-size="11">4 calendar systems with pluggable adapters</text>
  <text x="165" y="74" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.05em">CALENDAR</text><text x="315" y="74" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.05em">ADAPTER</text><text x="465" y="74" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.05em">DEFAULT LOCALE</text><text x="615" y="74" text-anchor="middle" fill="#71717a" font-size="10" font-weight="600" letter-spacing="0.05em">EPOCH</text>
  <line x1="90" y1="82" x2="690" y2="82" stroke="#3f3f46" stroke-width="1"/>
  <line x1="90" y1="112" x2="690" y2="112" stroke="#27272a" stroke-width="0.5"/><text x="165" y="104" text-anchor="middle" fill="#22c55e" font-size="11" font-weight="600">Gregorian</text><text x="315" y="104" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">NativeAdapter</text><text x="465" y="104" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">en-US</text><text x="615" y="104" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">1 CE</text><line x1="90" y1="146" x2="690" y2="146" stroke="#27272a" stroke-width="0.5"/><text x="165" y="138" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="600">Islamic (Hijri)</text><text x="315" y="138" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">IslamicAdapter</text><text x="465" y="138" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">ar-SA</text><text x="615" y="138" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">622 CE</text><line x1="90" y1="180" x2="690" y2="180" stroke="#27272a" stroke-width="0.5"/><text x="165" y="172" text-anchor="middle" fill="#f59e0b" font-size="11" font-weight="600">Persian (Jalali)</text><text x="315" y="172" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">PersianAdapter</text><text x="465" y="172" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">fa-IR</text><text x="615" y="172" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">622 CE</text><text x="165" y="206" text-anchor="middle" fill="#a855f7" font-size="11" font-weight="600">Hebrew</text><text x="315" y="206" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">HebrewAdapter</text><text x="465" y="206" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">he-IL</text><text x="615" y="206" text-anchor="middle" fill="#d4d4d8" font-size="11" font-weight="400">3761 BCE</text>
</svg>